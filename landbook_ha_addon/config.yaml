name: Landbook LAN MQTT Bridge
version: "0.10.8"
slug: landbook_lan_mqtt_bridge
description: "Landbook/Wonderfree LAN bridge: powerstation LAN con smart socket Wonderfree in HA."
url: "https://github.com/cash83/landbook-ha-addon"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
map:
  - share:rw
host_network: true
services:
  - mqtt:need
options:
  wf_email: ""
  wf_password: ""
  app: "landbook"
  device_key: ""
  device_host: ""
  device_port: 6607
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  battery_capacity_wh: 2048
  smart_sockets_enabled: true
  smart_socket_poll_interval: 30
  freeze_detection_enabled: true
  clear_command_states_on_start: true
  timezone: "Europe/Rome"
  log_level: "info"
schema:
  wf_email: str
  wf_password: password
  app: list(wonderfree|landbook|landecia|northamerica|europe|china)
  device_key: str?
  device_host: str
  device_port: port
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  battery_capacity_wh: int
  smart_sockets_enabled: bool
  smart_socket_poll_interval: int
  freeze_detection_enabled: bool
  clear_command_states_on_start: bool
  timezone: str?
  log_level: list(debug|info|warning|error)
